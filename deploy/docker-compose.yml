services:
  postgres:
    image: postgres:16-alpine
    container_name: polycrawl-postgres
    environment:
      - POSTGRES_USER=polycrawl
      - POSTGRES_PASSWORD=CHANGE_ME
      - POSTGRES_DB=polycrawl_db
      - TZ=Asia/Shanghai
    # ports:                # 容器间内部通信无需暴露到宿主机
    #   - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polycrawl -d polycrawl_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: polycrawl-redis
    command: redis-server --requirepass CHANGE_ME
    # ports:
    #   - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a CHANGE_ME ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: polycrawl-api
    environment:
      - TZ=Asia/Shanghai
      - POLYCRAWL_DATABASE_URL=postgresql+asyncpg://polycrawl:CHANGE_ME@postgres:5432/polycrawl_db
      - POLYCRAWL_REDIS_URL=redis://:CHANGE_ME@redis:6379/0
    command: >
      sh -c "python -m alembic upgrade head && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ..:/app:cached          # 挂载整个项目目录，宿主机可直接访问脚本
      - log-data:/app/data/logs  # 日志持久化
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: polycrawl-worker
    environment:
      - TZ=Asia/Shanghai
      - POLYCRAWL_DATABASE_URL=postgresql+asyncpg://polycrawl:CHANGE_ME@postgres:5432/polycrawl_db
      - POLYCRAWL_REDIS_URL=redis://:CHANGE_ME@redis:6379/0
    command: ["python", "-m", "services.worker.run"]
    volumes:
      - ..:/app:cached
      - media-data:/app/downloads   # 下载文件持久化（覆盖 /app/downloads）
      - log-data:/app/data/logs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redis-data:
  media-data:
  log-data:

