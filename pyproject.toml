[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polycrawl"
version = "0.1.0"
description = "Unified crawler platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "sqlalchemy>=2.0.31",
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "watchdog>=4.0.0",
  "httpx>=0.27.0",
  "requests>=2.32.0",
  "pycryptodome>=3.20.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0"
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
